services:
  - type: web
    name: cyberrecon-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyberrecon-db
          property: connectionString
      - key: SCAN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://cyberrecon.vercel.app
      - key: TASK_QUEUE_MODE
        value: inprocess
      - key: NMAP_PATH
        value: nmap

databases:
  - name: cyberrecon-db
    region: frankfurt
    plan: free
    ipAllowList: []

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cyberrecon
      POSTGRES_USER: cyberrecon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberrecon -d cyberrecon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://cyberrecon:${POSTGRES_PASSWORD:-development-only}@postgres:5432/cyberrecon
      SCAN_API_KEY: ${SCAN_API_KEY:-local-development-key-change-me}
      SUPABASE_URL: ${SUPABASE_URL}
      ALLOWED_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
      TASK_QUEUE_MODE: celery
      REDIS_URL: redis://redis:6379/0
      NMAP_PATH: nmap
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A worker.celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
